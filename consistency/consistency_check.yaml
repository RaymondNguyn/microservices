openapi: 3.0.0
info:
  description: This API provides consistency checks between the database and the Kafka queue
  version: "1.0.0"
  title: Consistency API
  contact:
    email: student@bcit.ca

paths:
  /update:
    post:
      summary: Endpoint to run the checks
      operationId: app.run_consistency_checks
      description: Runs the consistency checks and updates the JSON datastore
      responses:
        '200':
          description: Successfully ran the checks
          content:
            application/json:
              schema:
                type: object
                properties:
                  processing_time_ms:
                    type: integer
  /checks:
    get:
      summary: Displays the results of the checks
      operationId: app.get_checks
      description: Gets the results of the consistency checks from JSON and returns them
      responses:
        '200':
          description: Successfully returned the results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checks'
        '404':
          description: No checks have been run
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

components:
  schemas:
    Counts:
      type: object
      required:
        - processing
        - database
        - queue
      properties:
        processing:
          type: object
          properties:
            wind_count:
              type: integer
            temp_count:
              type: integer
        database:
          type: object
          properties:
            wind_count:
              type: integer
            temp_count:
              type: integer
        queue:
          type: object
          properties:
            wind_count:
              type: integer
            temp_count:
              type: integer

    Missing:
      type: object
      properties:
        in_analyzer_not_storage:
          type: array
          items:
            type: object
            properties:
              event_id:
                type: integer
              trace_id:
                type: integer
        in_storage_not_analyzer:
          type: array
          items:
            type: object
            properties:
              event_id:
                type: integer
              trace_id:
                type: integer

    Checks:
      type: object
      required:
        - last_update
        - count
        - missing
      properties:
        last_update:
          type: string
          format: date-time
        count:
          $ref: '#/components/schemas/Counts'
        missing:
          $ref: '#/components/schemas/Missing'

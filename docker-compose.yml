services:

  db:
    image: mysql
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: 1
      MYSQL_USER: ray
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: wind
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  zookeeper:
    image: wurstmeister/zookeeper
    volumes:
      - zookeeper_data:/data
      - zookeeper_data:/datalog

  kafka:
    image: wurstmeister/kafka
    command: [start-kafka.sh]
    environment:
      KAFKA_CREATE_TOPICS: "events:1:1"
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_LISTENERS: INSIDE://:29092,OUTSIDE://:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:29092,OUTSIDE://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list | grep -w events"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  receiver:
    build:
      context: receiver
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config
    environment:
      - CONFIG_FILE=/app/config/receiver_conf.yml
      - LOG_FILE=/app/config/log_conf.yml
    depends_on:
      kafka:
        condition: service_healthy

  storage:
    build:
      context: storage
      dockerfile: Dockerfile
    volumes:
      - ./config:/app/config
    environment:
      - CONFIG_FILE=/app/config/storage_conf.yml
      - LOG_FILE=/app/config/log_conf.yml
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  processing:
    build:
      context: processing
      dockerfile: Dockerfile
    ports:
      - "8100:8100"
    volumes:
      - ./config:/app/config
    environment:
      - CONFIG_FILE=/app/config/processing_conf.yml
      - LOG_FILE=/app/config/log_conf.yml
    depends_on:
      - storage

  analyzer:
    build:
      context: analyzer
      dockerfile: Dockerfile
    ports:
      - "8900:8900"
    volumes:
      - ./config:/app/config
    environment:
      - CONFIG_FILE=/app/config/analyzer_conf.yml
      - LOG_FILE=/app/config/log_conf.yml
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  mysql_data:
  kafka_data:
  zookeeper_data:

services:
  db:
    image: mysql
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: 1
      MYSQL_USER: "${STORAGE_USER}"
      MYSQL_PASSWORD: "${STORAGE_PASSWORD}"
      MYSQL_DATABASE: wind
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  zookeeper:
    image: wurstmeister/zookeeper
    volumes:
      - zookeeper_data:/opt/zookeeper-3.4.13/data

  kafka:
    image: wurstmeister/kafka
    command: [start-kafka.sh]
    environment:
      KAFKA_CREATE_TOPICS: "events:1:1"
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_LISTENERS: INSIDE://:29092,OUTSIDE://:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:29092,OUTSIDE://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LOG_DIRS: /kafka/kafka-logs
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_BROKER_ID: 1
    volumes:
      - ./data/kafka:/kafka/kafka-logs
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list | grep -w events"]
      interval: 60s
      timeout: 60s
      retries: 10
      start_period: 60s

  receiver:
    build:
      context: receiver
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config
      - ./logs:/logs
    depends_on:
      kafka:
        condition: service_healthy
    user: "1444:1444"

  storage:
    build:
      context: storage
      dockerfile: Dockerfile
    volumes:
      - ./config:/app/config
      - ./logs:/logs
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    user: "1444:1444"

  processing:
    build:
      context: processing
      dockerfile: Dockerfile
    ports:
      - "8100:8100"
    volumes:
      - ./config:/app/config
      - ./logs:/logs
      - ./data/processing:/app/data
    depends_on:
      - storage
    user: "1444:1444"

  analyzer:
    build:
      context: analyzer
      dockerfile: Dockerfile
    ports:
      - "8900:8900"
    volumes:
      - ./config:/app/config
      - ./logs:/logs
    depends_on:
      kafka:
        condition: service_healthy
    user: "1444:1444"
  
  nginx:
    build:
      context: frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
    - "80:80"
    depends_on:
      receiver:
        condition: service_started
      storage:
        condition: service_started
      kafka:
        condition: service_started
      db:
        condition: service_started
      processing:
        condition: service_started
      analyzer:
        condition: service_started

volumes:
  mysql_data:
  zookeeper_data:
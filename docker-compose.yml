services:

  db:
    image: mysql
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: 1
      MYSQL_USER: ray
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: wind
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    volumes:
      - /opt/zookeeper-3.4.13/data

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092 # Use localhost for external access
      KAFKA_LISTENER_SECURITY_PROTOCOL: PLAINTEXT
      KAFKA_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /kafka/kafka-logs
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - kafka_data:/kafka/kafka-logs


  receiver:
    build:
      context: receiver
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config
    environment:
      - CONFIG_FILE=/app/config/receiver_conf.yml
      - LOG_FILE=/app/config/log_conf.yml
    depends_on:
      - kafka

  storage:
    build:
      context: storage
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    volumes:
      - ./config:/app/config
    environment:
      - CONFIG_FILE=/app/config/storage_conf.yml
      - LOG_FILE=/app/config/log_conf.yml
    depends_on:
      - db
      - kafka

  processing:
    build:
      context: processing
      dockerfile: Dockerfile
    ports:
      - "8100:8100"
    volumes:
      - ./config:/app/config
    environment:
      - CONFIG_FILE=/app/config/processing_conf.yml
      - LOG_FILE=/app/config/log_conf.yml
    depends_on:
      - storage

  analyzer:
    build:
      context: analyzer
      dockerfile: Dockerfile
    ports:
      - "8900:8900"
    volumes:
      - ./config:/app/config
    environment:
      - CONFIG_FILE=/app/config/analyzer_conf.yml
      - LOG_FILE=/app/config/log_conf.yml
    depends_on:
      - kafka


volumes:
  mysql_data:
  kafka_data:
  zookeeper_data:


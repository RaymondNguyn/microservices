openapi: 3.0.3
info:
  title: Wind Speed API
  description: An API to receive and process weather-related events including wind speed, temperature, and alerts.
  version: 1.0.0
paths:
  /events/wind-speed:
    get:
      tags:
      - wind-speed
      summary: Retrieve temperature events within a time range
      description: Fetch all temperature events recorded between the given timestamps.
      operationId: app.get_windspeed_readings
      parameters:
        - name: start_timestamp
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: The start of the time range (inclusive).
        - name: end_timestamp
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: The end of the time range (exclusive).
      responses:
        "200":
          description: A list of temperature events within the specified time range.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WindSpeedEvent'
        "400":
          description: Invalid timestamp format
        "404":
          description: No temperature events found
  /events/temperature:
    get:
      tags:
      - temp
      summary: Retrieve temperature events within a time range
      description: Fetch all temperature events recorded between the given timestamps.
      operationId: app.get_temp_readings
      parameters:
        - name: start_timestamp
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: The start of the time range (inclusive).
        - name: end_timestamp
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: The end of the time range (exclusive).
      responses:
        "200":
          description: A list of temperature events within the specified time range.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TemperatureEvent'
        "400":
          description: Invalid timestamp format
        "404":
          description: No temperature events found
  /count:
    get:
      summary: Gets the event stats
      operationId: app.get_sum_records
      description: Gets windspeed and temp
      responses:
        '200':
          description: Successfully returned a list of wind speed
          content:
            application/json:
              schema:
                type: object
                items:
                  $ref: '#/components/schemas/CountEvent'

  /listWind:
    get:
      summary: Gets the event stats
      operationId: app.get_wind_event_id
      description: Gets windspeed and temp
      responses:
        '200':
          description: Successfully returned a list of wind speed
          content:
            application/json:
              schema:
                type: object
                items:
                  $ref: '#/components/schemas/Wind_Event_Trace'

  /listTemp:
    get:
      summary: Gets the event stats
      operationId: app.get_temp_event_id
      description: Gets windspeed and temp
      responses:
        '200':
          description: Successfully returned a list of wind speed
          content:
            application/json:
              schema:
                type: object
                items:
                  $ref: '#/components/schemas/Temp_Event_Trace'

components:
  schemas:
    WindSpeedEvent:
      type: object
      required:
        - trace_id
        - eventID
        - deviceID
        - timeStamp
        - windspeed
      properties:
        eventID:
          type: string
          format: uuid
          description: Unique identifier for the wind speed event.
        deviceID:
          type: string
          description: Identifier for the device capturing the wind speed.
        timeStamp:
          type: string
          format: date-time
          description: Time when the wind speed was recorded.
        windspeed:
          type: number
          format: float
          description: The measured wind speed.
        trace_id:
          type: string
          format: uuid
          description: trace
    TemperatureEvent:
      type: object
      required:
        - trace_id
        - eventID
        - deviceID
        - timeStamp
        - temperature
      properties:
        eventID:
          type: string
          format: uuid
          description: Unique identifier for the temperature event.
        deviceID:
          type: string
          description: Identifier for the device capturing the temperature.
        timeStamp:
          type: string
          format: date-time
          description: Time when the temperature was recorded.
        temperature:
          type: number
          format: float
          description: The measured temperature.
        trace_id:
          type: string
          format: uuid
          description: trace id
    CountEvent:
      required:
        - wind_count
        - temp_count
      properties:
        wind_count:
          type: integer
          example: 500000
        temp_count:
          type: integer
          example: 200
      type: object

    Wind_Event_Trace:
      required:
        - event_id
        - trace_id
      properties:
        event_id:
          type: integer
          example: 500000
        trace_id:
          type: integer
          example: 200
      type: object

    Temp_Event_Trace:
      required:
        - event_id
        - trace_id
      properties:
        event_id:
          type: integer
          example: 500000
        trace_id:
          type: integer
          example: 200
      type: object